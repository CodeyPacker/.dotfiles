<title>{{REPO_NAME}} Tour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky stop rail on the left, one column of stops on the right. Stacks to a chip strip on phones. */
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --fg: #1b1f24;
  --muted: #5b6672;
  --line: #dde2e8;
  --accent: #2472c8;
  --accent-soft: #e3eefa;
  --warn: #a35a00;
  --warn-soft: #fbefdc;
  --code-bg: #eef1f4;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", Consolas, "SFMono-Regular", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121314; --surface: #191a1b; --fg: #d4d6d8; --muted: #8c949c; --line: #2a2b2c;
    --accent: #3b8eea; --accent-soft: #16273a; --warn: #e5a54b; --warn-soft: #2c2214; --code-bg: #1f2122;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121314; --surface: #191a1b; --fg: #d4d6d8; --muted: #8c949c; --line: #2a2b2c;
  --accent: #3b8eea; --accent-soft: #16273a; --warn: #e5a54b; --warn-soft: #2c2214; --code-bg: #1f2122;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 20px; padding-block: 40px 80px; display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 48px; }

header.top { grid-column: 1 / -1; display: grid; gap: 10px; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--f-display); font-size: clamp(30px, 5vw, 44px); line-height: 1.1; margin: 0; text-wrap: balance; }
.lede { max-width: 66ch; color: var(--muted); margin: 0; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.chip { font-family: var(--f-mono); font-size: 12px; padding: 3px 9px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); background: var(--surface); }

nav.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 24px); align-self: start; display: grid; gap: 2px; }
nav.rail a { display: grid; grid-template-columns: 34px 1fr; align-items: baseline; padding: 6px 10px; border-radius: 6px; color: var(--muted); text-decoration: none; font-size: 14px; }
nav.rail a span { font-family: var(--f-mono); font-size: 12px; }
nav.rail a:hover, nav.rail a:focus-visible { background: var(--accent-soft); color: var(--fg); outline: none; }
nav.rail a.adapted::after { content: "adapted"; grid-column: 2; font-family: var(--f-mono); font-size: 10px; letter-spacing: .05em; text-transform: uppercase; color: var(--accent); }

main { display: grid; gap: 56px; min-width: 0; }
section.stop { display: grid; gap: 14px; scroll-margin-top: 24px; min-width: 0; }
.stop-head { display: grid; gap: 4px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.stop-code { font-family: var(--f-mono); font-size: 13px; color: var(--accent); }
h2 { font-family: var(--f-display); font-size: 24px; line-height: 1.2; margin: 0; text-wrap: balance; }
.stop-sub { color: var(--muted); font-size: 14px; margin: 0; }
p { margin: 0; max-width: 68ch; }
code { font-family: var(--f-mono); font-size: .88em; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
pre { margin: 0; font-family: var(--f-mono); font-size: 13px; line-height: 1.55; background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; overflow-x: auto; }
pre .c { color: var(--muted); }
.src { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.src::before { content: "\2192  "; }

.files { display: grid; gap: 6px; padding: 0; margin: 0; list-style: none; }
.files li { display: grid; grid-template-columns: minmax(0, 280px) minmax(0, 1fr); gap: 16px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.files li:last-child { border-bottom: 0; }
.files code { background: none; padding: 0; color: var(--fg); overflow-wrap: anywhere; }
.files span { color: var(--muted); font-size: 14px; }

.layers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.layer { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: grid; gap: 6px; align-content: start; }
.layer b { font-family: var(--f-display); font-size: 16px; }
.layer .n { font-family: var(--f-mono); font-size: 11px; color: var(--accent); letter-spacing: .05em; text-transform: uppercase; }
.layer p { font-size: 14px; color: var(--muted); }

.trace { display: grid; gap: 0; counter-reset: hop; }
.hop { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 14px; position: relative; padding-bottom: 18px; }
.hop::before { counter-increment: hop; content: counter(hop); width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-mono); font-size: 12px; background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent); }
.hop:not(:last-child)::after { content: ""; position: absolute; left: 13.5px; top: 30px; bottom: 2px; width: 1px; background: var(--line); }
.hop div { display: grid; gap: 2px; min-width: 0; }
.hop strong { font-weight: 600; }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; min-width: 560px; }
th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-family: var(--f-mono); font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
tr:last-child td { border-bottom: 0; }
td code { background: none; padding: 0; }
td.y { color: var(--accent); font-family: var(--f-mono); font-size: 12px; }

.finding { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; padding: 12px 14px; border-radius: 8px; background: var(--warn-soft); }
.finding .fc { font-family: var(--f-mono); font-size: 13px; color: var(--warn); font-weight: 500; }
.finding p { font-size: 14px; }

.churn { display: grid; gap: 6px; }
.churn-row { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr) 28px; gap: 12px; align-items: center; font-size: 13px; }
.churn-row code { background: none; padding: 0; overflow-wrap: anywhere; }
.bar { height: 8px; border-radius: 4px; background: var(--accent); opacity: .75; }
.churn-row .v { font-family: var(--f-mono); color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }


@media (max-width: 820px) {
  .wrap { grid-template-columns: minmax(0, 1fr); gap: 28px; padding-inline: 16px; }
  nav.rail { position: static; display: flex; overflow-x: auto; gap: 6px; padding-bottom: 4px; }
  nav.rail a { display: block; white-space: nowrap; border: 1px solid var(--line); background: var(--surface); }
  nav.rail a span { margin-right: 6px; }
  nav.rail a.adapted::after { content: none; }
  .layers { grid-template-columns: minmax(0, 1fr); }
  .files li { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .churn-row { grid-template-columns: minmax(0, 1fr) 80px 24px; }
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
a.file { color: inherit; text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; cursor: pointer; }
a.file:hover, a.file:focus-visible { color: var(--accent); outline: none; }
.src a.file { color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); transform: translateX(-50%); background: var(--fg); color: var(--bg); font-size: 13px; padding: 8px 14px; border-radius: 8px; max-width: calc(100% - 32px); }
.toast code { background: none; color: inherit; }
</style>

<div class="wrap">
  <header class="top">
    <div class="eyebrow">Tour &middot; {{DEPTH: High-level | Technical}}</div>
    <h1>{{REPO_NAME}}</h1>
    <p class="lede">{{One or two sentences: what the repo is. For a technical tour, name any adapted stops and why.}}</p>
    <div class="meta">
      <!-- 3 to 5 chips of verified facts: tracked file count, commit count, languages, default branch. -->
      <span class="chip">{{FACT}}</span>
    </div>
  </header>

  <nav class="rail" aria-label="Tour stops">
    <!-- One link per stop. Add class="adapted" to a stop whose content was adapted to the repo type. -->
    <a href="#t1"><span>T1</span>{{Stop title}}</a>
  </nav>

  <main>
    <!-- One section per stop, id matching the rail link. Components available inside a stop:

      Mark every repo file mention as <code class="f">relative/path.ext</code> or <code class="f">relative/path.ext:42</code>.
      Folders and non-file terms use plain <code>. Clicking a code.f or .src entry copies its text for VS Code Ctrl+P.

      File list:
        <ul class="files"><li><code class="f">path/to/file.ext</code><span>What it does.</span></li></ul>

      Code excerpt (under 15 lines) with its source line:
        <pre>...</pre>
        <span class="src">path/to/file.ext:42</span>
        Several sources go in one .src separated by " &middot; ".

      Three peer concepts:
        <div class="layers"><div class="layer"><span class="n">Label</span><b>Name</b><p>Text.</p></div></div>

      Ordered trace (each hop a step in a real flow):
        <div class="trace"><div class="hop"><div><strong>Step</strong><span>Text.</span><span class="src">file:line</span></div></div></div>

      Table (wrap every table):
        <div class="table-wrap"><table>...</table></div>

      Finding (problem found while reading, numbered F1, F2, ...):
        <div class="finding"><span class="fc">F1</span><p>Text.</p></div>

      Churn bars (width = count / max count):
        <div class="churn" role="list"><div class="churn-row" role="listitem"><code class="f">file</code><div class="bar" style="width:100%"></div><span class="v">18</span></div></div>
    -->
    <section class="stop" id="t1">
      <div class="stop-head">
        <span class="stop-code">T1</span>
        <h2>{{Stop title}}</h2>
        <p class="stop-sub">{{One-sentence summary of the stop.}}</p>
      </div>
      {{Stop body built from the components above.}}
    </section>
  </main>
</div>

<div class="toast" id="toast" role="status" hidden></div>
<script>
// The artifact viewer blocks vscode:// links. code.f and .src mentions copy "path:line" for VS Code Quick Open (Ctrl+P) instead.
(function () {
  function wrap(ref) {
    var a = document.createElement("a");
    a.className = "file"; a.href = "#"; a.dataset.ref = ref; a.title = "Copy path for VS Code Ctrl+P";
    a.textContent = ref; return a;
  }
  document.querySelectorAll("code.f").forEach(function (el) {
    var t = el.textContent.trim();
    el.textContent = ""; el.appendChild(wrap(t));
  });
  document.querySelectorAll(".src").forEach(function (el) {
    var refs = el.textContent.split("\u00b7").map(function (r) { return r.trim(); }).filter(Boolean);
    el.textContent = "";
    refs.forEach(function (r, i) {
      if (i) el.appendChild(document.createTextNode(" \u00b7 "));
      el.appendChild(wrap(r));
    });
  });
  var toast = document.getElementById("toast"), timer;
  function show(text, ref) {
    toast.textContent = text + " ";
    var c = document.createElement("code"); c.textContent = ref; toast.appendChild(c);
    toast.hidden = false; clearTimeout(timer); timer = setTimeout(function () { toast.hidden = true; }, 3500);
  }
  document.addEventListener("click", function (e) {
    var a = e.target.closest("a.file");
    if (!a) return;
    e.preventDefault();
    var ref = a.dataset.ref;
    if (!navigator.clipboard) return show("Path:", ref);
    navigator.clipboard.writeText(ref).then(
      function () { show("Copied. In VS Code press Ctrl+P and paste:", ref); },
      function () { show("Copy failed. Path:", ref); });
  });
})();
</script>
