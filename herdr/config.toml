onboarding = false

# Sidebar row highlights use surface_dim. Let the terminal background show
# through instead of filling them with an opaque block.
[theme.custom]
surface_dim = "reset"
panel_bg = "reset"
accent = "reset"

[keys]
prefix = "ctrl+a"
focus_pane_left  = "prefix+h"
focus_pane_down  = "prefix+j"
focus_pane_up    = "prefix+k"
focus_pane_right = "prefix+l"
split_horizontal = "prefix+double_quote"
split_vertical   = "prefix+percent"
new_tab   = "prefix+c"
close_tab = "prefix+ampersand"
workspace_picker = "prefix+w"
goto             = "prefix+g"
copy_mode  = "prefix+y"

[ui]
agent_panel_sort = "spaces"
