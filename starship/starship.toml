"$schema" = "https://starship.rs/config-schema.json"

add_newline = true
format = "$directory$git_branch$git_status$cmd_duration$status$line_break$character"
palette = "preview"

# Every segment is a pill: a rounded cap (Nerd Font U+E0B6 / U+E0B4) on each
# side, coloured like the segment's background. Same radius idea as the
# cupertino herdr layout. Needs a Nerd Font or a terminal that falls back to one.

[character]
success_symbol = "[❯](bold violet)"
error_symbol = "[❯](bold danger)"
vimcmd_symbol = "[❮](bold info)"

[directory]
format = "[](fg:surface)[$path]($style)([ $read_only ]($read_only_style))[](fg:surface) "
truncation_length = 4
style = "bold fg:ink bg:surface"
read_only = "read only"
read_only_style = "fg:danger bg:danger_bg"

[git_branch]
format = "[](fg:violet_bg)[$branch]($style)[](fg:violet_bg) "
style = "bold fg:violet bg:violet_bg"

[git_status]
format = "$all_status$ahead_behind"
conflicted = '[](fg:danger_bg)[$count conflict](fg:danger bg:danger_bg)[](fg:danger_bg) '
modified = '[](fg:warning_bg)[$count modified](fg:warning bg:warning_bg)[](fg:warning_bg) '
staged = '[](fg:warning_bg)[$count staged](fg:warning bg:warning_bg)[](fg:warning_bg) '
untracked = '[](fg:warning_bg)[$count untracked](fg:warning bg:warning_bg)[](fg:warning_bg) '
deleted = '[](fg:danger_bg)[$count deleted](fg:danger bg:danger_bg)[](fg:danger_bg) '
renamed = '[](fg:warning_bg)[$count renamed](fg:warning bg:warning_bg)[](fg:warning_bg) '
typechanged = '[](fg:warning_bg)[$count type changed](fg:warning bg:warning_bg)[](fg:warning_bg) '
stashed = '[](fg:info_bg)[$count stashed](fg:info bg:info_bg)[](fg:info_bg) '
ahead = '[](fg:info_bg)[$count ahead](fg:info bg:info_bg)[](fg:info_bg) '
behind = '[](fg:warning_bg)[$count behind](fg:warning bg:warning_bg)[](fg:warning_bg) '
diverged = '[](fg:warning_bg)[$ahead_count ahead · $behind_count behind](fg:warning bg:warning_bg)[](fg:warning_bg) '

[cmd_duration]
min_time = 2000
format = "[](fg:info_bg)[$duration]($style)[](fg:info_bg) "
style = "fg:info bg:info_bg"

# The caps live in the symbols because success and failure use different
# backgrounds and the format string can't switch cap colour on its own.
[status]
disabled = false
format = "$symbol "
success_symbol = "[](fg:success_bg)[✓](fg:success bg:success_bg)[](fg:success_bg)"
symbol = "[](fg:danger_bg)[command failed](fg:danger bg:danger_bg)[](fg:danger_bg)"

# PReview Design System dark surfaces, text, and status colors.
[palettes.preview]
ink = "#f4f3f9"
muted = "#aba8bd"
violet = "#b5a6ff"
danger = "#ff7b7f"
warning = "#f8c15a"
info = "#86afff"
surface = "#262433"
violet_bg = "#2b2452"
danger_bg = "#3a171b"
warning_bg = "#3a2a0e"
info_bg = "#15264a"
success = "#45d69a"
success_bg = "#10301f"
