"$schema" = "https://starship.rs/config-schema.json"

add_newline = true
format = "$directory$git_branch$git_status$cmd_duration$line_break$character"
palette = "preview"

[character]
success_symbol = "[❯](bold violet)"
error_symbol = "[❯](bold danger)"
vicmd_symbol = "[❮](bold info)"

[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 4
style = "bold ink"
read_only_style = "danger"

[git_branch]
format = "[on](muted) [$branch]($style) "
style = "bold violet"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "warning"

[cmd_duration]
min_time = 2000
format = "[took](muted) [$duration]($style) "
style = "info"

# PReview Design System dark text and status colors.
[palettes.preview]
ink = "#f4f3f9"
muted = "#aba8bd"
violet = "#b5a6ff"
danger = "#ff7b7f"
warning = "#f8c15a"
info = "#86afff"
